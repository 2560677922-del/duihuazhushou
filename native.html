<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1018" />
    <title>引擎</title>
    <!--
      唯一的页面：**只加载引擎，不加载任何界面**。

      仓库里已经没有网页版界面了（Vue / router / views 已删除），
      所有页面都在原生层。这里保留一个空白页，是因为引擎本身
      （SillyTavern 的角色卡、世界书、预设、正则兼容）仍然是 TS，
      需要一个 JS 宿主 —— WebView 就是那个宿主。

      这个页面不画任何 UI，只在控制台和 #engine-status 里报启动状态。
      调试引擎：npm run dev，浏览器打开 /native.html。
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1018;
        color: #8a94a6;
        font: 13px/1.6 system-ui, -apple-system, sans-serif;
      }
      #engine-status {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 6px 12px;
        font-size: 11px;
        opacity: 0.55;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #engine-status.ready {
        opacity: 0;
      }
      #engine-status.error {
        color: #ff8a8a;
        opacity: 1;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="engine-status">引擎启动中…</div>
    <script type="module" src="/src/native/main.ts"></script>
  </body>
</html>
